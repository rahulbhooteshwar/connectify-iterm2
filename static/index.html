<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connectify</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/static/favicon-180.png" />
    <link rel="apple-touch-icon" href="/static/favicon-180.png" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <script>
      // Apply the saved colour scheme before first paint, so there is no flash
      (function () {
        var saved = localStorage.getItem('connectify-color-scheme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <script type="module" crossorigin src="/static/assets/index-BRfDb4O1.js"></script>
    <link rel="stylesheet" crossorigin href="/static/assets/index-S23SVj7z.css">
  </head>
  <!-- Identifiers, not prose: stop touch keyboards capitalising and
       autocorrecting what users type into hostnames and logins -->
  <body autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="root"></div>
  </body>
</html>
