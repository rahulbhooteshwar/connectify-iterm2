name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 2.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv sync
      
      - name: Inject version information
        run: |
          # From the tag when pushed, from the input when run manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          
          # Update version.py with release info
          cat > version.py << EOF
          """
          Version information for Connectify
          This file is automatically updated during GitHub releases
          """
          
          VERSION = "${VERSION}"
          BUILD_DATE = "${BUILD_DATE}"
          EOF
          
          echo "Version: $VERSION"
          echo "Build Date: $BUILD_DATE"
      
      - name: Build executable
        run: |
          uv run pyinstaller connectify.spec
      
      - name: Create release archive
        run: |
          cd dist
          tar -czf connectify-macos-arm64.tar.gz connectify/
          cd ..
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Tags the checked-out commit when this is run manually; matches the
          # pushed tag otherwise
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: ./dist/connectify-macos-arm64.tar.gz
          body: |
            # Connectify - SSH Session Manager for macOS

            ## Requirements

            - macOS with [iTerm2](https://iterm2.com/index.html) (required)
            - [iTerm2 browser plugin](https://iterm2.com/browser-plugin.html)
              (optional - only for the bundled `connectify-UI` profile)

            ## Installation

            ```bash
            curl -LsSf https://raw.githubusercontent.com/rahulbhooteshwar/connectify-iterm2/main/install.sh | sh
            ```

            ## What's in it

            - **Encrypted credentials vault** - SSH passwords and key passphrases
              in an AES-256-GCM file unlocked by your passcode, not the Keychain
            - **No sshpass** - secrets reach ssh through OpenSSH's own askpass
              mechanism over a private FIFO: never on disk, never on a command
              line, never in your shell history
            - **Web UI** for hosts, groups, per-host tile themes and profiles
            - **Bundled iTerm2 profiles** (PERSONAL / NON-PROD / PROD / UI)
              installed for you

            ## Upgrading from 1.x

            Credentials are **not** migrated from the macOS Keychain. On first
            start Connectify removes the old `auth_method`, `ssh_key_path` and
            `password` fields from `hosts.json`; create your credentials on the
            Vault page and assign one to each host. The interactive CLI is gone -
            hosts are managed in the web UI, and `connectify` now covers
            `ui start|stop|restart|status|logs`, `profiles`, `doctor` and
            `version`.

            ## Usage

            ```bash
            connectify ui start           # Start the web UI server (background)
            connectify ui status          # Check if it is running
            connectify doctor             # Diagnostics
            connectify --help             # Show all commands
            ```

            See the [README](https://github.com/rahulbhooteshwar/connectify-iterm2) for full documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
