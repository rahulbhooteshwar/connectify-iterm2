name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 2.0.0)'
        required: true
        type: string

jobs:
  # Work out the version once, so every architecture stamps the same one
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_date: ${{ steps.resolve.outputs.build_date }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          # From the tag when pushed, from the input when run manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine the version to release"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

  # One build per architecture: PyInstaller only ever builds for the machine it
  # runs on, so Apple Silicon and Intel need their own runners.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
            expected_arch: arm64
          - runner: macos-15-intel    # Intel (macos-13 was retired)
            arch: amd64
            expected_arch: x86_64
    runs-on: ${{ matrix.runner }}
    # A retired or unavailable runner label queues forever - fail instead
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Inject version information
        run: |
          cat > version.py << EOF
          """
          Version information for Connectify
          This file is automatically updated during GitHub releases
          """

          VERSION = "${{ needs.prepare.outputs.version }}"
          BUILD_DATE = "${{ needs.prepare.outputs.build_date }}"
          EOF
          cat version.py

      - name: Build executable
        run: uv run pyinstaller connectify.spec

      - name: Verify the binary matches this runner's architecture
        run: |
          # Guards against a runner image changing architecture under us and
          # shipping, say, two arm64 builds under different names
          BINARY="dist/connectify/connectify"
          file "$BINARY"
          ACTUAL=$(lipo -archs "$BINARY")
          echo "Built for: ${ACTUAL} (expected ${{ matrix.expected_arch }})"
          if [ "$ACTUAL" != "${{ matrix.expected_arch }}" ]; then
            echo "::error::Expected a ${{ matrix.expected_arch }} binary but built ${ACTUAL}"
            exit 1
          fi

      - name: Smoke test the binary
        run: |
          ./dist/connectify/connectify version
          ./dist/connectify/connectify --help

      - name: Create release archive
        run: |
          cd dist
          tar -czf "connectify-macos-${{ matrix.arch }}.tar.gz" connectify/
          shasum -a 256 "connectify-macos-${{ matrix.arch }}.tar.gz"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: connectify-macos-${{ matrix.arch }}
          path: dist/connectify-macos-${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Tags the checked-out commit when this is run manually; matches the
          # pushed tag otherwise
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          files: artifacts/*.tar.gz
          # GitHub writes the "what changed" section from the commits since
          # the last tag, so this only has to carry what is true of every
          # release. Anything version-specific belongs in the commits.
          generate_release_notes: true
          body: |
            **Connectify** manages your SSH sessions from a web UI and opens
            each one in its own iTerm2 tab.

            ## Install

            ```bash
            curl -LsSf https://raw.githubusercontent.com/rahulbhooteshwar/connectify-iterm2/main/install.sh | sh
            ```

            Already installed? `connectify upgrade` does the same thing.

            Builds are provided for **Apple Silicon** (`arm64`) and **Intel**
            (`amd64`); the installer picks the right one. Requires
            [iTerm2](https://iterm2.com/index.html). The
            [browser plugin](https://iterm2.com/browser-plugin.html) is optional
            and only used by the bundled `connectify-UI` profile.

            ## What it does

            - **Encrypted credentials vault** - passwords and key passphrases in
              an AES-256-GCM file unlocked by your passcode, not the Keychain. A
              credential can carry the username it logs in with, so a fleet
              sharing one login is one entry.
            - **No sshpass** - secrets reach ssh through OpenSSH's own askpass
              mechanism over a private FIFO: never on disk, never on a command
              line, never in your shell history. Trusting an unknown host is
              asked of you, never answered automatically.
            - **Hosts, groups and tile themes** in the web UI, with per-host
              iTerm2 profiles and optional verbose SSH logging.
            - **Bundled iTerm2 profiles** (PERSONAL / NON-PROD / PROD / UI)
              installed for you.

            ## Upgrading from 1.x

            Credentials are **not** migrated from the macOS Keychain. On first
            start Connectify removes the old `auth_method`, `ssh_key_path` and
            `password` fields from `hosts.json`; create your credentials on the
            Vault page and assign one to each host. The interactive CLI is gone -
            hosts are managed in the web UI, and `connectify` covers
            `ui start|stop|restart|status|logs`, `profiles`, `doctor`,
            `upgrade` and `version`.

            Full documentation is in the
            [README](https://github.com/rahulbhooteshwar/connectify-iterm2).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
